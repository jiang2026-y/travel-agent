# 企业级智能旅行助手统一错误信封 v1
type: object
additionalProperties: false
required: [error, trace_id, request_id]
properties:
  error:
    type: object
    additionalProperties: false
    required: [code, message, retryable]
    properties:
      code: { type: string, pattern: '^[a-z0-9_]{1,100}$' }
      message: { type: string, minLength: 1, maxLength: 500 }
      retryable: { type: boolean }
  trace_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
  request_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
