[mypy]
python_version = 3.12
strict = true
warn_unused_configs = true
mypy_path = services/api-server/src:services/agent-server/src:services/tool-gateway/src
# Check source trees only: per-service test packages share the module name "tests".
files = services/api-server/src, services/agent-server/src, services/tool-gateway/src, packages/sensitive-masker/src
# Vendored third-party skill scripts are excluded from type checking.
exclude = services/agent-server/src/travel_agent_agent/skills/

# Alibaba Cloud Bailian/Tea SDKs ship no type stubs; silence only their missing-stub errors.
[mypy-alibabacloud_bailian20231229.*]
ignore_missing_imports = True

[mypy-alibabacloud_tea_openapi.*]
ignore_missing_imports = True

[mypy-alibabacloud_tea_util.*]
ignore_missing_imports = True
