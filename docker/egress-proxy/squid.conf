# 本文件定义 Egress Proxy 的默认拒绝规则。
# 仅允许代理进程启动并记录最小状态；未配置的 Provider、域名和方法全部拒绝。
http_port 3128
acl dashscope_host dstdomain ws-afyh9lpghkjx1iz8.cn-beijing.maas.aliyuncs.com
# 目的地天气（免费）、目的地资讯与百炼长期记忆域名；未在网关配置对应密钥时不会被调用。
acl weather_host dstdomain wttr.in
acl newsdata_host dstdomain newsdata.io
acl bailian_memory_host dstdomain dashscope.aliyuncs.com
# Orizn 签证 REST 服务；未配置 orizn_visa_api_key 时仅免 Key 工具会被调用。
acl visa_host dstdomain visa.orizn.app
# 百炼知识库检索（Retrieve 接口走 bailian.cn-beijing.aliyuncs.com，未放行时知识库恒返回不可用）。
acl bailian_host dstdomain bailian.cn-beijing.aliyuncs.com
acl ssl_port port 443
acl connect_method method CONNECT
http_access allow connect_method dashscope_host ssl_port
http_access allow connect_method weather_host ssl_port
http_access allow connect_method newsdata_host ssl_port
http_access allow connect_method bailian_memory_host ssl_port
http_access allow connect_method visa_host ssl_port
http_access allow connect_method bailian_host ssl_port
http_access deny all
cache deny all
access_log none
cache_log /dev/stderr
pid_filename none
