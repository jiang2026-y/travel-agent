# 城市等级配置
#
# YAML key 使用 ASCII，中文城市名放入 List 值中。
# 未出现在任何列表中的城市默认归为“其他”。
travel:
  policy:
    tier1-cities:
      - 北京
      - 上海
      - 广州
      - 深圳
    new-tier1-cities:
      - 成都
      - 杭州
      - 重庆
      - 武汉
      - 西安
      - 苏州
      - 天津
      - 南京
      - 长沙
      - 郑州
      - 东莞
      - 青岛
      - 沈阳
      - 宁波
      - 昆明
      - 厦门
      - 合肥
      - 佛山
      - 无锡
      - 哈尔滨
    tier2-cities:
      - 济南
      - 福州
      - 大连
      - 贵阳
      - 太原
      - 南昌
      - 南宁
      - 石家庄
      - 长春
      - 呼和浩特
      - 兰州
      - 乌鲁木齐
      - 海口
      - 银川
      - 西宁
      - 拉萨
    # 高频城市对的显式最短衔接时长，单位为分钟，方向无关。
    city-pair-minutes:
      "[北京-上海]": 300
      "[北京-广州]": 360
      "[北京-深圳]": 360
      "[北京-杭州]": 300
      "[北京-南京]": 270
      "[北京-天津]": 90
      "[北京-成都]": 360
      "[北京-西安]": 330
      "[北京-武汉]": 300
      "[北京-郑州]": 240
      "[上海-广州]": 330
      "[上海-深圳]": 330
      "[上海-杭州]": 120
      "[上海-南京]": 130
      "[上海-苏州]": 90
      "[上海-成都]": 390
      "[上海-武汉]": 300
      "[广州-深圳]": 90
