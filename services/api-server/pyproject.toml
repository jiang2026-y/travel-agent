[project]
name = "travel-agent-api"
version = "0.1.0"
description = "企业级智能旅行助手 API Server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25,<26",
  "asyncpg>=0.30,<1",
  "cryptography>=44,<46",
  "fastapi>=0.135,<0.140",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "sqlmodel>=0.0.39,<0.1",
  "travel-agent-sensitive-masker",
  "uvicorn[standard]>=0.30,<0.40",
]

[tool.uv.sources]
travel-agent-sensitive-masker = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent_api"]
