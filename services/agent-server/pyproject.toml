[project]
name = "travel-agent-agent"
version = "0.1.0"
description = "企业级智能旅行助手 Agent Server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=44,<46",
  "fastapi>=0.135,<0.140",
  "httpx>=0.28,<0.29",
  "langchain>=1.3,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-redis>=0.1,<1",
  "pyyaml>=6.0,<7",
  "redis>=5.2,<7",
  "travel-agent-sensitive-masker",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.30,<0.40",
]

[tool.uv.sources]
travel-agent-sensitive-masker = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent_agent"]
